id = "rcosteira.autocontinue"
name = "Auto Continue"
version = "0.1.0"
min_herdr_version = "0.8.2"
description = "Watches agents for usage-limit walls, badges the countdown to the reset ($wall), and re-prompts the agents you armed once the window reopens."
platforms = ["macos", "linux"]

# Bring the watcher back up after a restart / live handoff. Armed panes are
# keyed by pane id, so a session restore keeps its arming.
[[startup]]
command = ["python3", "autocontinue.py", "start"]

# Add $wall to the sidebar rows, so the badge is actually rendered. Backs the
# config up first and reloads the server. Startup only warns; this one writes.
[[actions]]
id = "enable-badge"
title = "Auto-continue: add the $wall badge to the sidebar"
contexts = ["global"]
command = ["python3", "autocontinue.py", "enable-badge"]

# The reverse: take $wall out of the rows and clear it off the panes.
[[actions]]
id = "disable-badge"
title = "Auto-continue: remove the $wall badge from the sidebar"
contexts = ["global"]
command = ["python3", "autocontinue.py", "disable-badge"]

# Arm/disarm the focused agent. Nothing is ever typed into a pane that is not
# armed, so this is the plugin's main switch — bind it to a key (see README).
[[actions]]
id = "arm"
title = "Auto-continue: arm/disarm the focused agent"
contexts = ["pane", "global"]
command = ["python3", "autocontinue.py", "arm"]

[[actions]]
id = "open-list"
title = "Auto-continue: open list"
contexts = ["global"]
command = ["python3", "autocontinue.py", "open-list"]

[[actions]]
id = "start"
title = "Auto-continue: start watcher"
contexts = ["global"]
command = ["python3", "autocontinue.py", "start"]

[[actions]]
id = "stop"
title = "Auto-continue: stop watcher"
contexts = ["global"]
command = ["python3", "autocontinue.py", "stop"]

[[actions]]
id = "status"
title = "Auto-continue: status"
contexts = ["global"]
command = ["python3", "autocontinue.py", "status"]

# Detection report for the current panes; writes nothing, sends nothing.
[[actions]]
id = "scan"
title = "Auto-continue: scan panes (dry)"
contexts = ["global"]
command = ["python3", "autocontinue.py", "scan"]

[[panes]]
id = "list"
title = "Auto Continue"
command = ["python3", "autocontinue.py", "ui"]
placement = "overlay"

# Wake the daemon the moment an agent stops, which is when a wall can appear.
# The hook does no detecting: the daemon owns the wall state, and a second
# writer would race it. It just says "look now", which is what lets the sweep
# behind it run every 60 seconds instead of every 10.
#
# Spell the event with dots. herdr's API schema lists the same kinds with
# underscores, and the manifest turns `pane_agent_status_changed` down with
# "unknown event". Verified on herdr 0.8.2, hence min_herdr_version.
[[events]]
on = "pane.agent_status_changed"
command = ["python3", "autocontinue.py", "on-status"]
